name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_name"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >-
          xcodebuild build
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker
          -sdk iphonesimulator
          -configuration Debug
          -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=NO
          AD_HOC_CODE_SIGNING_ALLOWED=YES
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=

      - name: Diagnose simulator app signing
        shell: bash
        run: |
          app_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Debug-iphonesimulator/BabySleepTracker.app' -print -quit)"

          if [ -z "$app_path" ]; then
            echo "BabySleepTracker.app was not found in DerivedData."
            exit 0
          fi

          echo "$app_path"

          echo "Effective BabySleepTracker signing settings:"
          xcodebuild -showBuildSettings \
            -project BabySleepTracker.xcodeproj \
            -target BabySleepTracker \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|AD_HOC_CODE_SIGNING_ALLOWED|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER' || true

          echo "Bundle signature details:"
          codesign -dv --verbose=4 "$app_path" || true

          echo "Bundle signature verification:"
          codesign --verify --verbose=4 "$app_path" || true

          echo "Deep bundle verification:"
          codesign --verify --deep --strict --verbose=4 "$app_path" || true

          echo "Executable signature verification:"
          codesign --verify --verbose=4 "$app_path/BabySleepTracker" || true

          echo "Executable signature details:"
          codesign -dv --verbose=4 "$app_path/BabySleepTracker" || true

          echo "Entitlements:"
          codesign -d --entitlements :- "$app_path" || true

      - name: Test
        run: >-
          xcodebuild test
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=NO
          AD_HOC_CODE_SIGNING_ALLOWED=YES
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
