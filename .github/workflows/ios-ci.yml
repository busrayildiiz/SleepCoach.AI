name: iOS CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    tags: ['v*']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      suites: ${{ steps.select.outputs.suites }}
      focused: ${{ steps.select.outputs.focused }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate CI routing and merge gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request && "$DRAFT" == true ]]; then
            echo 'full=false' >> "$GITHUB_OUTPUT"
            suites=$(python3 .github/scripts/classify-ios.py "$BASE_SHA" "$HEAD_SHA")
            echo "suites=$suites" >> "$GITHUB_OUTPUT"
            if [[ "$suites" == '[]' ]]; then
              echo 'focused=false' >> "$GITHUB_OUTPUT"
            else
              echo 'focused=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'suites=[]' >> "$GITHUB_OUTPUT"
            echo 'focused=false' >> "$GITHUB_OUTPUT"
          fi

  fast-xctest:
    needs: classify
    if: needs.classify.outputs.full == 'false'
    uses: ./.github/workflows/ios-test.yml
    with:
      tier: fast
      simulator: standard

  focused-ui:
    needs: classify
    if: needs.classify.outputs.full == 'false' && needs.classify.outputs.focused == 'true'
    strategy:
      fail-fast: false
      matrix:
        simulator: [standard, compact]
    uses: ./.github/workflows/ios-test.yml
    with:
      tier: focused
      simulator: ${{ matrix.simulator }}
      suites: ${{ needs.classify.outputs.suites }}

  full-validation:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        simulator: [standard, compact]
    uses: ./.github/workflows/ios-test.yml
    with:
      tier: full
      simulator: ${{ matrix.simulator }}

  merge-validation:
    if: always()
    needs: [classify, full-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require full validation on both simulators
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_REQUIRED: ${{ needs.classify.outputs.full }}
          FULL_RESULT: ${{ needs.full-validation.result }}
        run: python3 .github/scripts/check-merge-gate.py

  # Preserve existing required check names until protections can be inspected
  # and merge-validation has been verified. Draft checks cannot turn these green.
  legacy-merge-safeguards:
    name: ${{ matrix.check }}
    if: always()
    needs: merge-validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: ['build-and-test', 'build-and-test (compact)']
    steps:
      - env:
          GATE_RESULT: ${{ needs.merge-validation.result }}
        run: test "$GATE_RESULT" = success
