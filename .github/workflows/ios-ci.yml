name: iOS CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.simulator == 'standard' && 'build-and-test' || 'build-and-test (compact)' }}
    strategy:
      fail-fast: false
      matrix:
        simulator: ${{ fromJSON(github.head_ref == 'feat/home-sleep-cards-redesign' && '["standard","compact"]' || '["standard"]') }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SIMULATOR_CLASS: ${{ matrix.simulator }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Select a compatible iPhone simulator
        id: simulator
        run: |
          export SIMULATOR_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list devices available --json | python3 -c '
          import json, os, sys

          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIMULATOR_SDK_VERSION"].replace(".", "-")
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          device = next((d for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone") and (os.environ["SIMULATOR_CLASS"] != "compact" or d["name"] == "iPhone SE (3rd generation)")), None)
          if device is None:
              sys.exit("No available iPhone simulator for " + runtime)
          print("Selected " + device["name"] + " (" + device["udid"] + ") on " + runtime)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("udid=" + device["udid"] + "\n")
          '

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker
          -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Build and run XCTest
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: >-
          xcodebuild test
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker
          -configuration Debug
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=NO
          AD_HOC_CODE_SIGNING_ALLOWED=YES
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=

      - name: Export Home visual verification attachments
        if: ${{ always() && github.head_ref == 'feat/home-sleep-cards-redesign' }}
        run: |
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TestResults.xcresult" --output-path "$RUNNER_TEMP/HomeScreenshots"
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TestResults.xcresult" > "$RUNNER_TEMP/HomeScreenshots/test-summary.json"
          fi

      - name: Upload Home screenshots
        if: ${{ always() && github.head_ref == 'feat/home-sleep-cards-redesign' }}
        uses: actions/upload-artifact@v4
        with:
          name: home-screenshots-${{ matrix.simulator }}
          path: ${{ runner.temp }}/HomeScreenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failed test results
        if: ${{ failure() || github.head_ref == 'feat/home-sleep-cards-redesign' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ matrix.simulator }}
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
