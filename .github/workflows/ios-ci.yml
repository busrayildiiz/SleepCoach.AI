name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_name"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >-
          xcodebuild build
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker
          -sdk iphonesimulator
          -configuration Debug
          -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=NO
          AD_HOC_CODE_SIGNING_ALLOWED=YES
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
          
      - name: Diagnose simulator app signing
        shell: bash
        run: |
          echo "Resolving actual Xcode build output..."

          build_settings="$(xcodebuild -showBuildSettings \
            -project BabySleepTracker.xcodeproj \
            -target BabySleepTracker \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=)"

          target_build_dir="$(printf '%s\n' "$build_settings" | awk -F ' = ' '$1 == "TARGET_BUILD_DIR" { print $2; exit }')"
          full_product_name="$(printf '%s\n' "$build_settings" | awk -F ' = ' '$1 == "FULL_PRODUCT_NAME" { print $2; exit }')"

          app_path="${target_build_dir}/${full_product_name}"

          echo "TARGET_BUILD_DIR=$target_build_dir"
          echo "FULL_PRODUCT_NAME=$full_product_name"
          echo "APP_PATH=$app_path"

          if [ ! -d "$app_path" ]; then
            echo "BabySleepTracker.app was not found at the resolved build path."
            echo "Searching DerivedData as a fallback:"
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -name "BabySleepTracker.app" \
              -print || true
            exit 0
          fi

          echo "Bundle signature details:"
          codesign -dv --verbose=4 "$app_path" || true

          echo "Bundle signature verification:"
          codesign --verify --verbose=4 "$app_path" || true

          echo "Deep bundle verification:"
          codesign --verify --deep --strict --verbose=4 "$app_path" || true

          echo "Executable signature verification:"
          codesign --verify --verbose=4 "$app_path/BabySleepTracker" || true

          echo "Executable signature details:"
          codesign -dv --verbose=4 "$app_path/BabySleepTracker" || true

          echo "Entitlements:"
          codesign -d --entitlements :- "$app_path" || true
          
      - name: Test
        run: >-
          xcodebuild test
          -project BabySleepTracker.xcodeproj
          -scheme BabySleepTracker
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGNING_REQUIRED=NO
          AD_HOC_CODE_SIGNING_ALLOWED=YES
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
