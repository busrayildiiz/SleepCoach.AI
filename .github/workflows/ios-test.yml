name: iOS test runner

on:
  workflow_call:
    inputs:
      tier:
        required: true
        type: string
      simulator:
        required: true
        type: string
      checkout_sha:
        default: ''
        type: string
      suites:
        default: '[]'
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    # Full validation reserves 20 minutes outside build/test for setup and evidence.
    timeout-minutes: ${{ inputs.tier == 'full' && 70 || 45 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TIER: ${{ inputs.tier }}
      SIMULATOR_CLASS: ${{ inputs.simulator }}
      SUITES: ${{ inputs.suites }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_sha || github.sha }}
      - name: Select pinned toolchain and simulator
        id: simulator
        run: |
          mkdir -p "$RUNNER_TEMP/CIArtifacts"
          git rev-parse HEAD | tee "$RUNNER_TEMP/CIArtifacts/revision.txt"
          echo "$TIER / $SIMULATOR_CLASS revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version | tee "$RUNNER_TEMP/CIArtifacts/toolchain.log"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/CIArtifacts/devices.json"
          python3 - <<'PY'
          import json, os
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-18-5'
          models = {'standard': 'iPhone 16 Pro', 'compact': 'iPhone SE (3rd generation)'}
          model = models[os.environ['SIMULATOR_CLASS']]
          with open(os.environ['RUNNER_TEMP'] + '/CIArtifacts/devices.json') as f:
              devices = json.load(f)['devices'].get(runtime, [])
          matches = [d for d in devices if d.get('isAvailable') and d['name'] == model]
          if len(matches) != 1:
              raise SystemExit(f'Required unique {model} on {runtime}; found {len(matches)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('udid=' + matches[0]['udid'] + '\n')
          print(model, runtime, matches[0]['udid'])
          PY
      - name: Boot selected simulator
        timeout-minutes: 5
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          # bootstatus boots a shutdown destination and waits until it is usable.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b \
            2>&1 | tee "$RUNNER_TEMP/CIArtifacts/simulator-boot.log"
      - name: Cache pinned Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-16F6-${{ hashFiles('BabySleepTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Resolve pinned packages
        run: |
          set -o pipefail
          test -s BabySleepTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          started=$SECONDS
          xcodebuild -resolvePackageDependencies \
            -project BabySleepTracker.xcodeproj -scheme BabySleepTracker \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$RUNNER_TEMP/CIArtifacts/packages.log"
          echo "Package resolution: $((SECONDS-started)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- BabySleepTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Verify application startup
        id: startup
        if: inputs.tier != 'fast'
        timeout-minutes: 11
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          # Detect a shared launch failure before repeating it throughout the UI suite.
          # The full/focused selection below still has to pass after this preflight.
          coverage=NO
          if [[ "$TIER" == full ]]; then coverage=YES; fi
          exec python3 .github/scripts/ios-validation.py run --phase startup \
            --timeout-seconds 600 --grace-seconds 20 -- \
            xcodebuild test -project BabySleepTracker.xcodeproj -scheme BabySleepTracker \
            -configuration Debug -sdk iphonesimulator \
            -parallel-testing-enabled NO \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage "$coverage" \
            -resultBundlePath "$RUNNER_TEMP/startup/TestResults.xcresult" \
            -only-testing:BabySleepTrackerUITests/PrivacyUITests/testLaunchShowsHome \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
      - name: Export startup evidence
        timeout-minutes: 5
        if: always() && steps.startup.outcome != 'skipped'
        run: python3 .github/scripts/ios-validation.py collect --phase startup
      - name: Build and test selected coverage
        id: validation
        timeout-minutes: ${{ inputs.tier == 'full' && 50 || 35 }}
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          # Leave a minute for process shutdown, log flushing, and status reporting.
          BUILD_TEST_SECONDS: ${{ inputs.tier == 'full' && 2940 || 2040 }}
        run: |
          selection=()
          coverage=NO
          case "$TIER" in
            fast) selection=(-only-testing:BabySleepTrackerTests) ;;
            focused)
              python3 .github/scripts/ui-selection.py "$SUITES" > "$RUNNER_TEMP/ui-selection.txt"
              while IFS= read -r item; do selection+=("$item"); done < "$RUNNER_TEMP/ui-selection.txt"
              ;;
            full) coverage=YES ;;
            *) echo 'Unknown tier'; exit 1 ;;
          esac
          # Make the supervisor the step entry process so it receives Actions cancellation signals.
          exec python3 .github/scripts/ios-validation.py run --timeout-seconds "$BUILD_TEST_SECONDS" \
            --grace-seconds 20 -- xcodebuild test -project BabySleepTracker.xcodeproj -scheme BabySleepTracker \
            -configuration Debug -sdk iphonesimulator \
            -parallel-testing-enabled NO \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage "$coverage" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            "${selection[@]}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
      - name: Export results and screenshots
        timeout-minutes: 5
        if: always() && steps.validation.outcome != 'skipped'
        run: python3 .github/scripts/ios-validation.py collect
      - name: Upload test evidence
        if: always()
        id: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.tier }}-${{ inputs.simulator }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CIArtifacts
          if-no-files-found: error
          retention-days: 30
      - name: Link evidence
        if: ${{ always() && steps.artifacts.outcome == 'success' && steps.artifacts.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/"
          if [[ "$ARTIFACT_URL" == "$base"* && "${ARTIFACT_URL#"$base"}" =~ ^[0-9]+$ ]]; then
            printf '[%s / %s test evidence](%s)\n' "$TIER" "$SIMULATOR_CLASS" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
